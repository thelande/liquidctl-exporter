name: Releases

# Trigger on releases.
on:
  release:
    types:
      - published
      - edited

permissions:
  contents: write
  packages: write

env:
  PROMU_VER: '0.20.0'

jobs:
  build_container:
    name: Build Container Images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Login to Docker Registry
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push image
      uses: docker/bake-action@v7
      with:
        push: true
        files: ./docker-bake.hcl
        targets: image-all
      env:
        GIT_SHA: ${{ github.sha }}

  build_linux:
    name: Build Linux Binaries
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v6
      with:
        go-version: '^1.26.1'

    - name: Build the binaries
      run: |
        make crossbuild
        TAG_NAME="${GITHUB_REF##*/v}"
        for arch in amd64 arm64; do
          mv output/$arch/liquidctl-exporter output/liquidctl-exporter-${TAG_NAME}-linux.${arch}
        done

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: liquidctl-exporter_binaries_linux
        path: output/liquidctl-exporter-*

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${GITHUB_REF##*/}"
        for i in output/liquidctl-exporter-*; do
          gh release upload $TAG_NAME $i
        done
